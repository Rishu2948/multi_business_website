AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Stack 3 - S3 buckets for the SRE Copilot Agent system.
  Creates three buckets:
    • sre-copilot-datalake-{AccountId}  — Delta Lake backup / KB sync staging
    • sre-copilot-kb-{AccountId}        — Bedrock Knowledge Base runbook documents
                                          (versioning enabled, 365-day lifecycle)
    • sre-copilot-ui-{AccountId}        — React Chat UI assets (PRIVATE — served
                                          exclusively via CloudFront + OAC in
                                          stack 08-cloudfront; no public S3 access)
  All buckets are in the same region as this stack to satisfy Req 5.5 (same
  region as the Bedrock Agent) and remain within the 5 GB S3 free-tier limit
  (Req 9.4).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Logical environment name; used as a resource name prefix/tag.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # --------------------------------------------------------------------------
  # DataLakeBucket
  # Name: sre-copilot-datalake-{AccountId}
  # --------------------------------------------------------------------------
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sre-copilot-datalake-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldDeltaExports
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Project
          Value: sre-copilot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: delta-lake-backup

  # --------------------------------------------------------------------------
  # KnowledgeBaseBucket
  # Name: sre-copilot-kb-{AccountId}
  # --------------------------------------------------------------------------
  KnowledgeBaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sre-copilot-kb-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRunbooksAfter365Days
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Project
          Value: sre-copilot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: bedrock-knowledge-base

  # --------------------------------------------------------------------------
  # UiBucket
  # Name: sre-copilot-ui-{AccountId}
  #
  # PRIVATE bucket — all public access is blocked. Assets are served
  # exclusively through the CloudFront distribution in stack 08-cloudfront
  # via Origin Access Control (OAC). The S3 website endpoint is NOT used;
  # CloudFront handles HTTPS and access restriction.
  #
  # The bucket policy granting CloudFront OAC access is created in stack
  # 08-cloudfront.yaml (after the OAC ID is known) rather than here to avoid
  # a circular dependency.
  #
  # Requirement 6.8: Serveable as a static site — satisfied via CloudFront.
  # Security: internal tool; no anonymous S3 access permitted.
  # --------------------------------------------------------------------------
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sre-copilot-ui-${AWS::AccountId}"
      # ALL public access blocked — CloudFront OAC is the only allowed reader
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: sre-copilot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: cloudfront-origin

# ---------------------------------------------------------------------------
# Outputs / Exports
# ---------------------------------------------------------------------------
Outputs:

  DataLakeBucketName:
    Description: Name of the Delta Lake backup S3 bucket.
    Value: !Ref DataLakeBucket
    Export:
      Name: DataLakeBucketName

  KnowledgeBaseBucketName:
    Description: Name of the Bedrock Knowledge Base S3 bucket.
    Value: !Ref KnowledgeBaseBucket
    Export:
      Name: KnowledgeBaseBucketName

  KnowledgeBaseBucketArn:
    Description: ARN of the Bedrock Knowledge Base S3 bucket.
    Value: !GetAtt KnowledgeBaseBucket.Arn
    Export:
      Name: KnowledgeBaseBucketArn

  UiBucketName:
    Description: >
      Name of the React Chat UI S3 bucket (private; served via CloudFront).
      Used by deploy.sh to upload Vite build output.
    Value: !Ref UiBucket
    Export:
      Name: UiBucketName

  UiBucketArn:
    Description: >
      ARN of the private UI S3 bucket.
      Imported by stack 08-cloudfront to create the OAC bucket policy.
    Value: !GetAtt UiBucket.Arn
    Export:
      Name: UiBucketArn

  UiBucketDomainName:
    Description: >
      Regional S3 domain name for the UI bucket (not the website endpoint).
      Used as the CloudFront S3 origin — must be the regional domain, not the
      website endpoint, when using Origin Access Control.
      Format: sre-copilot-ui-{AccountId}.s3.{Region}.amazonaws.com
    Value: !GetAtt UiBucket.RegionalDomainName
    Export:
      Name: UiBucketDomainName
