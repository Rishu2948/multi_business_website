name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  deploy-backend:
    name: Deploy API (ECS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build -t "${ECR_URI}:latest" -t "${ECR_URI}:${GITHUB_SHA}" .
          docker push "${ECR_URI}:latest"
          docker push "${ECR_URI}:${GITHUB_SHA}"

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${AWS_REGION}"
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --region "${AWS_REGION}"

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load frontend build secrets from AWS Secrets Manager
        id: sm
        env:
          FRONTEND_SECRET_NAME: ${{ secrets.FRONTEND_SECRET_NAME }}
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${FRONTEND_SECRET_NAME}" \
            --query SecretString \
            --output text \
            --region "${AWS_REGION}")
          echo "REACT_APP_BACKEND_URL=$(echo "$SECRET_JSON" | jq -r '.REACT_APP_BACKEND_URL')" >> "$GITHUB_ENV"
          echo "REACT_APP_GOOGLE_CLIENT_ID=$(echo "$SECRET_JSON" | jq -r '.REACT_APP_GOOGLE_CLIENT_ID')" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build
        working-directory: frontend
        run: |
          yarn install
          yarn build

      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/build/ "s3://${{ secrets.S3_BUCKET }}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
