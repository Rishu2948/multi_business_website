name: Deploy — SRE Copilot

on:
  push:
    branches: [main]
    paths:
      - 'sre-copilot/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  test:
    name: Run SRE Copilot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sre-copilot/requirements.txt

      - name: Install dependencies
        working-directory: sre-copilot
        run: pip install -r requirements.txt

      - name: Run notebook tests
        working-directory: sre-copilot
        run: python -m pytest notebooks/tests/ -v --tb=short
        continue-on-error: false

      - name: Run Lambda tests
        working-directory: sre-copilot/lambda/sre_gold_query_tools
        run: python -m pytest tests/ -v --tb=short
        # Lambda tests that need live Databricks are skipped in CI via markers
        continue-on-error: false

  build-lambda:
    name: Build Lambda packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sre-copilot/lambda/sre_gold_query_tools/requirements.txt

      # Build and zip Lambda layer + function packages, then upload to S3
      # The deploy.sh references these exact S3 keys during CloudFormation deploy.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload Lambda packages to S3
        working-directory: sre-copilot
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ENV="${DEPLOY_ENV}"
          DEPLOY_BUCKET="sre-copilot-deployments-${ACCOUNT_ID}"

          # Ensure the deployment bucket exists (created once in initial setup)
          aws s3api head-bucket --bucket "${DEPLOY_BUCKET}" --region "${AWS_REGION}" \
            || { echo "ERROR: Deployment bucket ${DEPLOY_BUCKET} does not exist."; \
                 echo "Create it first: aws s3 mb s3://${DEPLOY_BUCKET} --region ${AWS_REGION}"; exit 1; }

          # --- sre-gold-query-tools: Layer ---
          echo "Installing Lambda layer dependencies..."
          pip install \
            --requirement lambda/sre_gold_query_tools/requirements.txt \
            --target lambda/sre_gold_query_tools/layer/python \
            --upgrade --quiet

          # Zip and upload the layer
          cd lambda/sre_gold_query_tools
          zip -r /tmp/layer-${ENV}.zip layer/
          aws s3 cp /tmp/layer-${ENV}.zip \
            "s3://${DEPLOY_BUCKET}/lambda/sre_gold_query_tools/layer-${ENV}.zip" \
            --region "${AWS_REGION}"
          echo "Layer uploaded."

          # Zip and upload the function code
          zip /tmp/function-${ENV}.zip handler.py
          aws s3 cp /tmp/function-${ENV}.zip \
            "s3://${DEPLOY_BUCKET}/lambda/sre_gold_query_tools/function-${ENV}.zip" \
            --region "${AWS_REGION}"
          echo "Tools function uploaded."

          # --- sre-chat-handler ---
          cd ../../lambda/sre_chat_handler
          zip /tmp/chat-function-${ENV}.zip handler.py
          aws s3 cp /tmp/chat-function-${ENV}.zip \
            "s3://${DEPLOY_BUCKET}/lambda/sre_chat_handler/function-${ENV}.zip" \
            --region "${AWS_REGION}"
          echo "Chat handler uploaded."

  deploy-infra:
    name: Deploy CloudFormation stacks
    runs-on: ubuntu-latest
    needs: build-lambda
    outputs:
      agent_id: ${{ steps.outputs.outputs.agent_id }}
      agent_alias_id: ${{ steps.outputs.outputs.agent_alias_id }}
      chat_api_url: ${{ steps.outputs.outputs.chat_api_url }}
      kb_id: ${{ steps.outputs.outputs.kb_id }}
      ds_id: ${{ steps.outputs.outputs.ds_id }}
      kb_bucket: ${{ steps.outputs.outputs.kb_bucket }}
      ui_bucket: ${{ steps.outputs.outputs.ui_bucket }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Helper: deploy a single CloudFormation stack using the env params file
      # Stacks are deployed in dependency order (1 → 7)
      - name: Deploy stacks 1–7 (CloudFormation)
        working-directory: sre-copilot
        run: |
          PARAMS_FILE="infra/params/${DEPLOY_ENV}.json"

          deploy_stack() {
            local STACK_NAME="$1"
            local TEMPLATE="$2"
            echo "--- Deploying ${STACK_NAME} ---"
            aws cloudformation deploy \
              --stack-name "${STACK_NAME}" \
              --template-file "${TEMPLATE}" \
              --parameter-overrides "file://${PARAMS_FILE}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "${AWS_REGION}" \
              --no-fail-on-empty-changeset
          }

          deploy_stack "sre-iam-roles"     "infra/01-iam-roles.yaml"
          deploy_stack "sre-secrets"       "infra/02-secrets.yaml"
          deploy_stack "sre-s3-buckets"    "infra/03-s3-buckets.yaml"
          deploy_stack "sre-lambda-tools"  "infra/04-lambda-tools.yaml"
          deploy_stack "sre-lambda-chat"   "infra/05-lambda-chat.yaml"
          deploy_stack "sre-bedrock-kb"    "infra/06-bedrock-kb.yaml"
          deploy_stack "sre-bedrock-agent" "infra/07-bedrock-agent.yaml"

      # After stack 7 deploys, fetch the real AgentId/AgentAliasId and update
      # stack 5 (sre-lambda-chat) so the chat Lambda has correct env vars.
      # This is the two-phase deploy documented in setup.md → Step 7.
      - name: Update stack 5 with real Agent IDs (two-phase deploy)
        working-directory: sre-copilot
        run: |
          PARAMS_FILE="infra/params/${DEPLOY_ENV}.json"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" \
              --output text \
              --region "${AWS_REGION}"
          }

          AGENT_ID=$(get_output sre-bedrock-agent AgentId)
          AGENT_ALIAS_ID=$(get_output sre-bedrock-agent AgentAliasId)

          echo "Agent ID:       ${AGENT_ID}"
          echo "Agent Alias ID: ${AGENT_ALIAS_ID}"

          # Patch the params file in-place with the real IDs, then redeploy stack 5
          UPDATED_PARAMS=$(python3 -c "
import json, sys
params = json.load(open('${PARAMS_FILE}'))
for p in params:
    if p['ParameterKey'] == 'AgentId':
        p['ParameterValue'] = '${AGENT_ID}'
    elif p['ParameterKey'] == 'AgentAliasId':
        p['ParameterValue'] = '${AGENT_ALIAS_ID}'
print(json.dumps(params))
")
          echo "${UPDATED_PARAMS}" > "${PARAMS_FILE}"

          aws cloudformation deploy \
            --stack-name "sre-lambda-chat" \
            --template-file "infra/05-lambda-chat.yaml" \
            --parameter-overrides "file://${PARAMS_FILE}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset

      - name: Collect stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" \
              --output text \
              --region "${AWS_REGION}"
          }

          echo "agent_id=$(get_output sre-bedrock-agent AgentId)"           >> "$GITHUB_OUTPUT"
          echo "agent_alias_id=$(get_output sre-bedrock-agent AgentAliasId)" >> "$GITHUB_OUTPUT"
          echo "chat_api_url=$(get_output sre-lambda-chat ChatApiUrl)"       >> "$GITHUB_OUTPUT"
          echo "kb_id=$(get_output sre-bedrock-kb KnowledgeBaseId)"          >> "$GITHUB_OUTPUT"
          echo "ds_id=$(get_output sre-bedrock-kb DataSourceId)"             >> "$GITHUB_OUTPUT"
          echo "kb_bucket=$(get_output sre-s3-buckets KnowledgeBaseBucketName)" >> "$GITHUB_OUTPUT"
          echo "ui_bucket=$(get_output sre-s3-buckets UiBucketName)"         >> "$GITHUB_OUTPUT"

  sync-kb:
    name: Sync Bedrock Knowledge Base (runbooks)
    runs-on: ubuntu-latest
    needs: deploy-infra
    # Only sync the KB when runbooks themselves changed — saves time and cost
    # on code-only pushes. Remove this if-condition to always sync.
    if: |
      contains(join(github.event.commits.*.modified, ','), 'sre-copilot/runbooks/') ||
      contains(join(github.event.commits.*.added, ','), 'sre-copilot/runbooks/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3==1.34.0 --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload runbooks to S3
        env:
          KB_BUCKET: ${{ needs.deploy-infra.outputs.kb_bucket }}
        working-directory: sre-copilot
        run: bash scripts/upload_runbooks.sh

      - name: Trigger KB ingestion job
        env:
          KB_ID: ${{ needs.deploy-infra.outputs.kb_id }}
          DS_ID: ${{ needs.deploy-infra.outputs.ds_id }}
        working-directory: sre-copilot
        run: python3 scripts/sync_kb.py

  deploy-ui:
    name: Build & Deploy SRE Chat UI
    runs-on: ubuntu-latest
    needs: deploy-infra
    # Only rebuild the UI when the chat-ui source or the API URL changed
    if: |
      contains(join(github.event.commits.*.modified, ','), 'sre-copilot/chat-ui/') ||
      contains(join(github.event.commits.*.added, ','), 'sre-copilot/chat-ui/') ||
      needs.deploy-infra.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sre-copilot/chat-ui/package-lock.json

      - name: Install and build Chat UI
        working-directory: sre-copilot/chat-ui
        env:
          VITE_API_URL: ${{ needs.deploy-infra.outputs.chat_api_url }}
        run: |
          npm ci --silent
          npm run build

      - name: Sync Chat UI to S3
        env:
          UI_BUCKET: ${{ needs.deploy-infra.outputs.ui_bucket }}
        run: |
          aws s3 sync sre-copilot/chat-ui/dist/ "s3://${UI_BUCKET}/" \
            --delete \
            --region "${AWS_REGION}"

  deployment-summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [deploy-infra, sync-kb, deploy-ui]
    if: always()
    steps:
      - name: Write summary
        env:
          AGENT_ID: ${{ needs.deploy-infra.outputs.agent_id }}
          AGENT_ALIAS_ID: ${{ needs.deploy-infra.outputs.agent_alias_id }}
          CHAT_API_URL: ${{ needs.deploy-infra.outputs.chat_api_url }}
        run: |
          echo "### SRE Copilot Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent ID | \`${AGENT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Alias ID | \`${AGENT_ALIAS_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Chat API URL | \`${CHAT_API_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA}\` |" >> $GITHUB_STEP_SUMMARY
