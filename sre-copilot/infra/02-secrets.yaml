AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Stack 2 - Secrets Manager placeholder secrets for the SRE Copilot Agent system.
  Creates sre/databricks-pat and sre/cloudwatch-credentials as placeholder secrets
  whose values are populated manually via setup_databricks_secrets.sh after deployment.
  Exports DatabricksPatSecretArn for use by downstream Lambda stacks.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Logical environment name; used as a resource name prefix/tag.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # --------------------------------------------------------------------------
  # DatabricksPatSecret
  # Stores the Databricks Personal Access Token (PAT) used by the
  # sre-gold-query-tools Lambda to authenticate against the Community Edition
  # SQL Warehouse via the databricks-sql-connector.
  #
  # IMPORTANT: The placeholder value "REPLACE_ME" must be overwritten with
  # the real PAT before running any Lambda function. Use the helper script:
  #   scripts/setup_databricks_secrets.sh <HOST> <HTTP_PATH> <PAT>
  #
  # Requirement 7.1, 7.3: Credentials must flow exclusively through Secrets
  # Manager; never embedded in code or environment variables.
  # --------------------------------------------------------------------------
  DatabricksPatSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: sre/databricks-pat
      Description: >
        Databricks Personal Access Token for the sre-gold-query-tools Lambda.
        Populate via scripts/setup_databricks_secrets.sh before first use.
        Format: plain-text PAT string (not a JSON object).
      SecretString: "REPLACE_ME"
      Tags:
        - Key: Project
          Value: sre-copilot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Sensitivity
          Value: high

  # --------------------------------------------------------------------------
  # CloudWatchCredentialsSecret
  # Placeholder for CloudWatch Logs export credentials used by the
  # 00_cw_export Databricks notebook when the Databricks workspace resides in
  # a different AWS account than the CloudWatch log groups (cross-account case).
  #
  # For single-account setups where the Databricks cluster's IAM instance
  # profile already has cloudwatch:FilterLogEvents permissions, this secret
  # is not required by the pipeline — it is provisioned as a placeholder for
  # completeness and future cross-account use.
  #
  # Format (when populated): JSON object:
  #   {"aws_access_key_id": "...", "aws_secret_access_key": "...",
  #    "aws_region": "us-east-1"}
  # --------------------------------------------------------------------------
  CloudWatchCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: sre/cloudwatch-credentials
      Description: >
        AWS credentials for the Databricks CW_Exporter notebook to call
        CloudWatch Logs API. Required only for cross-account deployments.
        Populate manually if Databricks runs in a separate AWS account.
        Format: {"aws_access_key_id":"...","aws_secret_access_key":"...","aws_region":"..."}
      SecretString: '{"aws_access_key_id":"REPLACE_ME","aws_secret_access_key":"REPLACE_ME","aws_region":"us-east-1"}'
      Tags:
        - Key: Project
          Value: sre-copilot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Sensitivity
          Value: high

# ---------------------------------------------------------------------------
# Outputs / Exports
# ---------------------------------------------------------------------------
Outputs:

  DatabricksPatSecretArn:
    Description: >
      ARN of the Secrets Manager secret holding the Databricks PAT.
      Imported by stack 04-lambda-tools to allow the sre-gold-query-tools
      Lambda's execution role to retrieve the secret at cold start.
    Value: !Ref DatabricksPatSecret
    Export:
      Name: DatabricksPatSecretArn

  CloudWatchCredentialsSecretArn:
    Description: >
      ARN of the Secrets Manager secret holding CloudWatch API credentials.
      Not exported (no downstream stack imports it); provided for operational
      reference and manual use by the CW_Exporter notebook.
    Value: !Ref CloudWatchCredentialsSecret
