name: Deploy — AI Catalog Chatbot

on:
  push:
    branches: [main]
    paths:
      - 'ai-chatbot/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  test:
    name: Run chatbot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-chatbot/requirements.txt

      - name: Install dependencies
        working-directory: ai-chatbot
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ai-chatbot
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Ensure the ECR repository exists (idempotent — safe to run every time)
      - name: Ensure ECR repository exists
        env:
          REPO_NAME: ai-chatbot-${{ env.DEPLOY_ENV }}
        run: |
          aws ecr describe-repositories \
            --repository-names "${REPO_NAME}" \
            --region "${AWS_REGION}" > /dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name "${REPO_NAME}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256 \
            --region "${AWS_REGION}" > /dev/null

      - name: Build and push Docker image
        env:
          ECR_URI: ${{ secrets.CHATBOT_ECR_REPOSITORY_URI }}
        run: |
          docker build \
            -f ai-chatbot/Dockerfile \
            -t "${ECR_URI}:latest" \
            -t "${ECR_URI}:${GITHUB_SHA}" \
            ai-chatbot/
          docker push "${ECR_URI}:latest"
          docker push "${ECR_URI}:${GITHUB_SHA}"

      # Sync the chatbot secrets file from AWS Secrets Manager
      # (the secrets file lives in infrastructure/secrets/.env.chatbot which
      #  is .gitignored — the pipeline reads the existing Secrets Manager secret
      #  and updates it only if CHATBOT_SECRET_NAME is provided as input)
      - name: Register new ECS task definition revision
        id: task-def
        env:
          ECR_URI: ${{ secrets.CHATBOT_ECR_REPOSITORY_URI }}
          CHATBOT_SECRET_ARN: ${{ secrets.CHATBOT_SECRET_ARN }}
          ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
          TASK_FAMILY: ai-chatbot-${{ env.DEPLOY_ENV }}
        run: |
          # Read LLM_PROVIDER from Secrets Manager to decide whether to inject LLM_API_KEY
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${CHATBOT_SECRET_ARN}" \
            --query SecretString \
            --output text \
            --region "${AWS_REGION}")
          LLM_PROVIDER=$(echo "${SECRET_JSON}" | jq -r '.LLM_PROVIDER // "bedrock"' | tr '[:upper:]' '[:lower:]')
          CHATBOT_PORT=$(echo "${SECRET_JSON}" | jq -r '.PORT // "8001"')
          LOG_GROUP="/ecs/ai-chatbot-${DEPLOY_ENV}"

          # Ensure the CloudWatch log group exists
          aws logs create-log-group --log-group-name "${LOG_GROUP}" \
            --region "${AWS_REGION}" 2>/dev/null || true

          # Build container definition — secrets injected at runtime from Secrets Manager
          CONTAINER_DEF=$(python3 -c "
import json, sys

use_api_key = '${LLM_PROVIDER}' not in ('bedrock',)
secret_keys = [
    'MONGO_URL', 'DB_NAME',
    'LLM_PROVIDER', 'LLM_MODEL', 'LLM_TIMEOUT_SECONDS',
    'CORS_ORIGINS', 'PORT', 'AWS_REGION',
]
if use_api_key:
    secret_keys.insert(4, 'LLM_API_KEY')

defn = {
    'name': 'ai-chatbot',
    'image': '${ECR_URI}:${GITHUB_SHA}',
    'essential': True,
    'portMappings': [{'containerPort': int('${CHATBOT_PORT}'), 'protocol': 'tcp'}],
    'secrets': [{'name': k, 'valueFrom': '${CHATBOT_SECRET_ARN}:{}::'.format(k)} for k in secret_keys],
    'logConfiguration': {
        'logDriver': 'awslogs',
        'options': {
            'awslogs-group': '${LOG_GROUP}',
            'awslogs-region': '${AWS_REGION}',
            'awslogs-stream-prefix': 'ai-chatbot',
        }
    },
    'healthCheck': {
        'command': ['CMD-SHELL', 'curl -sf http://localhost:${CHATBOT_PORT}/chat/health || exit 1'],
        'interval': 30, 'timeout': 5, 'retries': 3, 'startPeriod': 60,
    }
}
print(json.dumps([defn]))
")

          # Register the task definition
          NEW_ARN=$(aws ecs register-task-definition \
            --family "${TASK_FAMILY}" \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 512 \
            --memory 1024 \
            --execution-role-arn "${ECS_EXECUTION_ROLE_ARN}" \
            --task-role-arn "${ECS_TASK_ROLE_ARN}" \
            --container-definitions "${CONTAINER_DEF}" \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=${NEW_ARN}" >> "$GITHUB_OUTPUT"
          echo "New task definition: ${NEW_ARN}"

      - name: Update ECS service
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_def_arn }}
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.CHATBOT_ECS_CLUSTER }}" \
            --service "${{ secrets.CHATBOT_ECS_SERVICE }}" \
            --task-definition "${TASK_DEF_ARN}" \
            --force-new-deployment \
            --region "${AWS_REGION}"
          aws ecs wait services-stable \
            --cluster "${{ secrets.CHATBOT_ECS_CLUSTER }}" \
            --services "${{ secrets.CHATBOT_ECS_SERVICE }}" \
            --region "${AWS_REGION}"

      - name: Deployment summary
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_def_arn }}
        run: |
          echo "### AI Chatbot Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Task Definition:** \`${TASK_DEF_ARN}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ secrets.CHATBOT_ECS_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** \`${{ secrets.CHATBOT_ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
